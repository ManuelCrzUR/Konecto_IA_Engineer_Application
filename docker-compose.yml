services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-series76}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-series76}
      POSTGRES_DB: ${POSTGRES_DB:-series76}
    # Small local app: cap connections and kill abandoned transactions.
    command: >
      postgres
      -c max_connections=50
      -c idle_in_transaction_session_timeout=60000
    ports:
      # Bound to localhost by default: the default password must not reach the LAN.
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # $$ = read inside the container, so it follows POSTGRES_USER/POSTGRES_DB overrides
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    image: series76-api
    restart: unless-stopped
    env_file:
      # Optional: a clean clone without .env still starts (LLM calls return 503 llm_not_configured)
      - path: .env
        required: false
    environment:
      # Overrides the localhost URL from .env: inside the network the host is "db"
      DATABASE_URL: postgresql://${POSTGRES_USER:-series76}:${POSTGRES_PASSWORD:-series76}@db:5432/${POSTGRES_DB:-series76}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Localhost by default; the Android app reaches it through `adb reverse` (make android-reverse).
      # API_BIND=0.0.0.0 exposes it on the LAN for a physical phone. No auth (D-10).
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    healthcheck:
      # No curl in slim images: use urllib. urlopen raises on HTTP >= 400, so the exit code reflects health.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      # Startup may run OCR if the data must be rebuilt
      start_period: 60s

volumes:
  pgdata:
